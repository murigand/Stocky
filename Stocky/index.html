<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stocky – Inventory System</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#17211c;--mu:#66736c;--ac:#0f7b5f;--ac2:#e6f4ef;--bd:#dde4e0;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--tx:#e8efeb;--mu:#8fa098;--ac:#3ec79d;--ac2:#1c3a30;--bd:#2a362f;--rd:#ef7b6d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101613;--card:#18211c;--tx:#e8efeb;--mu:#8fa098;--ac:#3ec79d;--ac2:#1c3a30;--bd:#2a362f;--rd:#ef7b6d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}h1 span{color:var(--ac)}h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
nav button{flex:1;white-space:nowrap;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
button.b{background:var(--ac);color:#fff;border:0;padding:10px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
button.d{background:transparent;color:var(--rd);border:1px solid var(--rd);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mu);font-weight:600}
td input{padding:6px}.r{text-align:right}.mu{color:var(--mu)}.low{color:var(--rd);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--ac2);border-radius:12px;padding:12px}.st b{display:block;font-size:20px}.st small{color:var(--mu)}
.pick{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--bd);border-radius:8px;margin-top:6px;cursor:pointer}
.pick:hover,.pick.on{border-color:var(--ac);background:var(--ac2)}
.msg{padding:8px 12px;border-radius:8px;margin-bottom:10px;background:var(--ac2)}.msg.e{color:var(--rd)}
.auth{max-width:380px;margin:12vh auto 0}.tot{font-size:22px;font-weight:700;color:var(--ac)}
@media print{nav,header,.np{display:none!important}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={user:null,hash:null,cur:'RWF',products:[],sales:[],reports:[]},mem=null,authed=false,tab='sell',sel=null,note='',err=false,last=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem('stockly')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('stockly',JSON.stringify(S))}catch(e){}};
const hash=async t=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const m=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2})+' '+S.cur;
const say=(t,e)=>{note=t;err=!!e;render()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const msg=()=>{const h=note?`<div class="msg ${err?'e':''}">${esc(note)}</div>`:'';note='';return h};

async function doAuth(){
  const u=$('#u').value.trim(),p=$('#p').value;
  if(!u||p.length<4)return say('Enter a username and a password of at least 4 characters.',1);
  if(!S.user){S.user=u;S.hash=await hash(p);save();authed=true;return say('Account created. Welcome!')}
  if(u===S.user&&await hash(p)===S.hash){authed=true;tab='sell';return render()}
  say('Wrong username or password.',1)
}
function authView(){
  const first=!S.user;
  return`<div class="card auth"><h1>Stock<span>y</span></h1><p class="mu">${first?'Welcome! Create your account to get started.':'Sign in to open your stock.'}</p>${msg()}
  <label>Username</label><input id="u" autocomplete="username"><div style="height:8px"></div>
  <label>Password</label><input id="p" type="password" autocomplete="current-password"><div style="height:12px"></div>
  <button class="b" style="width:100%" onclick="doAuth()">${first?'Create account':'Sign in'}</button></div>`
}
const today=()=>new Date().toISOString().slice(0,10);
const open=()=>S.sales.filter(x=>!x.closed);
function addProduct(){
  const n=$('#pn').value.trim(),q=parseFloat($('#pq').value),u=$('#pu').value.trim(),pr=parseFloat($('#pp').value);
  if(!n||!(q>=0)||!u||!(pr>=0))return say('Fill in name, quantity, unit and price.',1);
  const ex=S.products.find(p=>p.name.toLowerCase()===n.toLowerCase()&&p.unit===u);
  if(ex){ex.qty+=q;ex.price=pr}else S.products.push({id:uid(),name:n,qty:q,unit:u,price:pr});
  save();say(ex?`Added ${q} ${u} to existing ${n}.`:`${n} added.`)
}
function pickView(){
  const q=($('#sq')?.value||'').toLowerCase();
  const l=S.products.filter(p=>p.name.toLowerCase().includes(q));
  return l.map(p=>`<div class="pick ${sel===p.id?'on':''}" onclick="sel='${p.id}';render()"><span>${esc(p.name)}</span><span class="mu">${p.qty} ${esc(p.unit)} · ${m(p.price)}</span></div>`).join('')||'<p class="mu">No product found.</p>'
}
function sell(){
  const p=S.products.find(x=>x.id===sel),q=parseFloat($('#sqty').value);
  if(!p)return say('Select a product first.',1);
  if(!(q>0))return say('Enter a quantity to buy.',1);
  if(q>p.qty)return say(`Only ${p.qty} ${p.unit} of ${p.name} in stock.`,1);
  p.qty=+(p.qty-q).toFixed(4);
  S.sales.push({id:uid(),date:today(),time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),name:p.name,unit:p.unit,qty:q,price:p.price,total:q*p.price,closed:false});
  save();sel=null;say(`Sold ${q} ${p.unit} of ${p.name} for ${m(q*p.price)}.`)
}
function closeDay(){
  const o=open();
  if(!o.length&&!confirm('No sales today. Close anyway?'))return;
  const r={id:uid(),date:today(),closedAt:new Date().toLocaleString(),sales:o,total:o.reduce((a,x)=>a+x.total,0),stock:S.products.map(p=>({...p}))};
  o.forEach(x=>x.closed=true);S.reports.unshift(r);last=r;save();render()
}
function report(r){
  return`<div class="card"><h2>Day report – ${esc(r.date)} <span class="mu">(closed ${esc(r.closedAt)})</span></h2>
  <h2 class="mu">Transactions</h2><div class="tw"><table><tr><th>Time</th><th>Product</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr>
  ${r.sales.map(s=>`<tr><td>${esc(s.time)}</td><td>${esc(s.name)}</td><td class="r">${s.qty} ${esc(s.unit)}</td><td class="r">${m(s.price)}</td><td class="r">${m(s.total)}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">No sales.</td></tr>'}</table></div>
  <p class="r">Total money for the day: <span class="tot">${m(r.total)}</span></p>
  <h2 class="mu">Remaining stock</h2><div class="tw"><table><tr><th>Product</th><th class="r">Quantity</th><th class="r">Price</th></tr>
  ${r.stock.map(p=>`<tr><td>${esc(p.name)}</td><td class="r">${p.qty} ${esc(p.unit)}</td><td class="r">${m(p.price)}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">Empty.</td></tr>'}</table></div>
  <div class="np" style="margin-top:12px;display:flex;gap:8px"><button class="g" onclick="print()">Print report</button></div></div>`
}
function logout(){authed=false;last=null;sel=null;render()}
async function saveAcct(){
  const u=$('#nu').value.trim(),cp=$('#cp').value,np=$('#np').value;
  if(await hash(cp)!==S.hash)return say('Current password is wrong.',1);
  if(u)S.user=u;if(np){if(np.length<4)return say('New password needs 4+ characters.',1);S.hash=await hash(np)}
  S.cur=$('#cu').value.trim()||S.cur;save();say('Settings updated.')
}
function saveProd(id){
  const p=S.products.find(x=>x.id===id),g=k=>$(`#e${k}${id}`).value;
  const n=g('n').trim(),q=parseFloat(g('q')),pr=parseFloat(g('p'));
  if(!n||!(q>=0)||!(pr>=0))return say('Invalid product details.',1);
  Object.assign(p,{name:n,qty:q,unit:g('u').trim()||p.unit,price:pr});save();say('Product updated.')
}
function delProd(id){if(confirm('Delete this product?')){S.products=S.products.filter(p=>p.id!==id);save();render()}}
function wipe(){if(confirm('Erase ALL products, sales and reports? Account is kept.')){S.products=[];S.sales=[];S.reports=[];save();say('All data erased.')}}

function tabView(){
  const o=open(),tot=o.reduce((a,x)=>a+x.total,0);
  if(tab==='stock')return`<div class="stats"><div class="st"><small>Products</small><b>${S.products.length}</b></div><div class="st"><small>Stock value</small><b>${m(S.products.reduce((a,p)=>a+p.qty*p.price,0))}</b></div><div class="st"><small>Today's sales</small><b>${m(tot)}</b></div></div>
  <div class="card"><h2>Add product</h2><div class="row">
  <div><label>Name</label><input id="pn"></div><div><label>Quantity</label><input id="pq" type="number" min="0" step="any"></div>
  <div><label>Unit</label><input id="pu" list="un" placeholder="kg, box…"><datalist id="un"><option>kg<option>pieces<option>boxes<option>bottles<option>litres<option>packs<option>bags<option>cartons</datalist></div>
  <div><label>Price per unit</label><input id="pp" type="number" min="0" step="any"></div></div><button class="b" onclick="addProduct()">Add product</button></div>
  <div class="card"><h2>Current stock</h2><div class="tw"><table><tr><th>Name</th><th class="r">Quantity</th><th>Unit</th><th class="r">Price</th></tr>
  ${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td class="r ${p.qty<=5?'low':''}">${p.qty}</td><td>${esc(p.unit)}</td><td class="r">${m(p.price)}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">No products yet.</td></tr>'}</table></div></div>`;
  if(tab==='sell')return`<div class="card"><h2>Sell a product</h2><label>Search product by name</label><input id="sq" oninput="$('#pl').innerHTML=pickView()" placeholder="Type a name…">
  <div id="pl">${pickView()}</div>
  ${sel?(()=>{const p=S.products.find(x=>x.id===sel);return`<div class="row" style="margin-top:12px;align-items:end"><div><label>Quantity to buy (${esc(p.unit)}) – ${p.qty} available</label><input id="sqty" type="number" min="0" step="any"></div><div><button class="b" onclick="sell()">Sell</button></div></div>`})():''}</div>
  <div class="card"><h2>Today’s sales so far</h2><p>Total: <span class="tot">${m(tot)}</span> <span class="mu">(${o.length} transactions)</span></p></div>`;
  if(tab==='close')return last?report(last)+`<button class="b" onclick="logout()">Finish &amp; log out</button>`:
  `<div class="card"><h2>Close stock for today</h2><p class="mu">This ends the day: you’ll get the full list of today’s sales, the total money, and the remaining stock.</p>
  <p>Open transactions: <b>${o.length}</b> · Total: <span class="tot">${m(tot)}</span></p><button class="b" onclick="closeDay()">Close stock</button></div>
  <div class="card"><h2>Previous reports</h2>${S.reports.map(r=>`<div class="pick" onclick="last=S.reports.find(x=>x.id==='${r.id}');render()"><span>${esc(r.date)}</span><span class="mu">${m(r.total)}</span></div>`).join('')||'<p class="mu">None yet.</p>'}</div>`;
  return`<div class="card"><h2>Account</h2><div class="row"><div><label>Username</label><input id="nu" value="${esc(S.user)}"></div><div><label>Current password</label><input id="cp" type="password"></div><div><label>New password (optional)</label><input id="np" type="password"></div><div><label>Currency</label><input id="cu" value="${esc(S.cur)}"></div></div><button class="b" onclick="saveAcct()">Save</button></div>
  <div class="card"><h2>Product details</h2><div class="tw"><table><tr><th>Name</th><th>Qty</th><th>Unit</th><th>Price</th><th></th></tr>
  ${S.products.map(p=>`<tr><td><input id="en${p.id}" value="${esc(p.name)}"></td><td><input id="eq${p.id}" type="number" step="any" value="${p.qty}"></td><td><input id="eu${p.id}" value="${esc(p.unit)}"></td><td><input id="ep${p.id}" type="number" step="any" value="${p.price}"></td><td style="white-space:nowrap"><button class="g" onclick="saveProd('${p.id}')">Save</button> <button class="d" onclick="delProd('${p.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="mu">No products.</td></tr>'}</table></div></div>
  <div class="card"><h2>Danger zone</h2><button class="d" onclick="wipe()">Erase all data</button></div>`
}
function render(){
  if(!authed){$('#app').innerHTML=authView();return}
  const T=[['sell','Sell'],['stock','Products'],['close','Close stock'],['set','Settings']];
  $('#app').innerHTML=`<header><h1>Stock<span>y</span></h1><button class="g" onclick="logout()">Log out (${esc(S.user)})</button></header>
  <nav>${T.map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';last=null;note='';render()">${v}</button>`).join('')}</nav>${msg()}${tabView()}`
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!authed)doAuth()});
render();
</script></body></html>
